spring:
  application:
    name: stazy
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      pool-name: HikariCP
      max-lifetime: 1200000
      connection-timeout: 20000
      auto-commit: true
    jpa:
      hibernate:
        ddl-auto: validate
  liquibase:
    change-log: classpath:database.changelog/db.changelog-master.xml
    enabled: true
app:
  security:
    public-paths:
      - v1/users/verify-otp/tenant
      - v1/fcm/register-token
      - /api/health
      - /api/pgs/filter
      - /api/addpglist
      - /images/**
      - /v1/s/**
      - /v1/users/refreshtoken
      - /v1/users/login/owner
      - /v1/users/login/tenant
      - /v1/users/verify-otp/owner
      - /api/v1/auth/**
      - /api/v1/public/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /swagger-resources/**
      - /swagger-resources
      - /swagger-ui/index.html
      - /v3/api-docs/**
      - /v3/api-docs.yaml
    unauthorized-api-paths:
      - /api/v1/public/**
    admin-api-paths:
      - /api/v1/admin/**
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Requested-With
      - Accept
      - Origin
      - Access-Control-Request-Method
      - Access-Control-Request-Headers
      - Access-Control-Allow-Origin
      - User-Agent
      - X-Trace-Id
    exposed-headers: Authorization,X-Trace-Id
    allow-credentials: true
    max-age: 3600
    cors:
      enabled: true
      path-pattern: /mystazyapp/api/**
otp:
  expiration:
    minutes: 10
server:
  port : 9092
  servlet:
    context-path: /mystazyapp/api
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
pg:
  photos:
    url-base: http://localhost:9092${server.servlet.context-path}/photos/
